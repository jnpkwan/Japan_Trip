<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japan Trip 2027 — Savings Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    /* Summer Japan palette */
    --bg:           #FFF8F2;           /* warm rice-paper white */
    --bg2:          #FFFFFF;           /* pure card white */
    --bg3:          #FFF0E8;           /* peach tint for inputs */
    --border:       rgba(220,170,140,0.25);
    --border-hover: rgba(220,100,80,0.35);
    --text:         #2A1A0F;           /* deep sumi ink */
    --text-muted:   #7A5848;           /* warm cedar */
    --text-dim:     #B89080;           /* soft clay */

    /* Summer Japan accent colors */
    --sakura:       #F2637A;           /* natsuzakura pink */
    --sakura-light: #FFD6E0;
    --matcha:       #5B9E6A;           /* summer bamboo green */
    --matcha-light: #D4EDDA;
    --natsu:        #F5832A;           /* natsu orange — yukata coral */
    --natsu-light:  #FFE0C7;
    --asagi:        #3A9DC2;           /* asagi sky blue */
    --asagi-light:  #C8E8F5;
    --kiniro:       #E8A820;           /* kiniro summer gold */
    --kiniro-light: #FFF0C0;
    --fuji:         #8B63C7;           /* wisteria purple */
    --fuji-light:   #EAD9FF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Airy summer background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 0% 0%,   rgba(242,99,122,0.08)  0%, transparent 55%),
      radial-gradient(ellipse 60% 50% at 100% 0%,  rgba(58,157,194,0.07)  0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 50% 100%, rgba(232,168,32,0.06)  0%, transparent 55%);
    pointer-events: none;
    z-index: 0;
  }

  .page-wrapper {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ── HEADER ── */
  header {
    padding: 56px 0 44px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 32px;
  }

  .header-left { flex: 1; }

  .jp-label {
    font-family: 'Shippori Mincho', serif;
    font-size: 13px;
    color: var(--sakura);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .jp-label::before {
    content: '';
    display: inline-block;
    width: 28px;
    height: 2px;
    background: linear-gradient(90deg, var(--sakura), var(--natsu));
    border-radius: 2px;
  }

  h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: clamp(36px, 5vw, 58px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(120deg, var(--sakura), var(--natsu));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-meta {
    margin-top: 16px;
    font-size: 14px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .header-meta span {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .countdown-chip {
    background: linear-gradient(135deg, var(--sakura), var(--natsu));
    border-radius: 100px;
    padding: 7px 18px;
    font-size: 13px;
    color: #fff;
    font-weight: 600;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(242,99,122,0.3);
    animation: pulse-sakura 3s ease-in-out infinite;
  }
  @keyframes pulse-sakura {
    0%, 100% { box-shadow: 0 4px 16px rgba(242,99,122,0.3); }
    50%       { box-shadow: 0 4px 24px rgba(242,99,122,0.5); }
  }

  /* ── GRAND TOTAL BANNER ── */
  .grand-total {
    background: linear-gradient(135deg, #fff 60%, #FFF5F8 100%);
    border: 1.5px solid rgba(242,99,122,0.18);
    border-radius: 24px;
    padding: 32px 36px;
    margin-bottom: 40px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 24px;
    align-items: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 32px rgba(242,99,122,0.07), 0 1px 4px rgba(0,0,0,0.04);
  }
  .grand-total::before {
    content: '日本';
    position: absolute;
    right: 32px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Shippori Mincho', serif;
    font-size: 80px;
    color: rgba(242,99,122,0.06);
    line-height: 1;
    pointer-events: none;
  }

  .stat-block { }
  .stat-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .stat-value {
    font-family: 'Shippori Mincho', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .stat-value.highlight { color: var(--natsu); }
  .stat-value.green     { color: var(--matcha); }

  .grand-progress-wrap {
    grid-column: 1 / -1;
    margin-top: 4px;
  }
  .progress-bar-bg {
    background: rgba(200,150,130,0.15);
    border-radius: 100px;
    height: 10px;
    overflow: hidden;
    position: relative;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 100px;
    background: linear-gradient(90deg, var(--sakura), var(--natsu), var(--kiniro));
    transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }
  .progress-bar-fill::after {
    content: '';
    position: absolute;
    right: -1px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    background: var(--natsu);
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 8px rgba(245,131,42,0.6);
  }

  /* ── FAMILY CARDS ── */
  .families-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
    gap: 20px;
  }

  @media (max-width: 600px) {
    .families-grid { grid-template-columns: 1fr; }
    .grand-total { grid-template-columns: 1fr 1fr; }
    header { flex-direction: column; }
  }

  .family-card {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    transition: box-shadow 0.3s, transform 0.3s, border-color 0.3s;
    box-shadow: 0 2px 12px rgba(180,120,100,0.07);
  }
  .family-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(180,100,80,0.12);
  }

  .family-header {
    padding: 22px 26px 18px;
    border-bottom: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .family-color-pill {
    padding: 4px 12px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #fff;
    flex-shrink: 0;
  }
  .family-title { flex: 1; }
  .family-name {
    font-family: 'Shippori Mincho', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }
  .family-subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 3px;
  }
  .family-pct {
    font-family: 'Shippori Mincho', serif;
    font-size: 30px;
    font-weight: 800;
    line-height: 1;
  }

  .members-list { padding: 10px 16px 16px; }

  .member-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 14px 10px;
    border-radius: 14px;
    transition: background 0.2s;
    border-bottom: 1px solid var(--border);
  }
  .member-row:last-child { border-bottom: none; }
  .member-row:hover { background: var(--bg); }

  .member-info { min-width: 0; }
  .member-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .member-bar-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .member-mini-bar {
    flex: 1;
    height: 10px;
    background: rgba(180,130,110,0.13);
    border-radius: 100px;
    overflow: hidden;
  }
  .member-mini-fill {
    height: 100%;
    border-radius: 100px;
    transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }
  .member-pct-small {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 700;
    min-width: 36px;
    text-align: right;
  }

  .member-amounts {
    text-align: right;
    flex-shrink: 0;
  }
  .member-saved {
    font-family: 'Shippori Mincho', serif;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.2;
  }
  .member-remaining {
    font-size: 11px;
    color: var(--text-dim);
    text-align: right;
    margin-top: 3px;
  }

  .member-status {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    font-weight: 700;
  }
  .member-status.done  { background: var(--matcha-light);  color: var(--matcha); }
  .member-status.near  { background: var(--kiniro-light);  color: var(--kiniro); }
  .member-status.early { background: var(--sakura-light);  color: var(--sakura); }

  /* Floating sakura SVG */
  .sakura-deco {
    position: fixed;
    top: 0; right: 0;
    width: 240px;
    height: 240px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.55;
  }

  .last-updated {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1.5px solid var(--border);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .grand-total { grid-template-columns: 1fr 1fr; }
    .grand-total::before { display: none; }
    header { padding: 40px 0 32px; }
  }
</style>
</head>
<body>

<svg class="sakura-deco" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="180" cy="60" r="80" fill="rgba(242,99,122,0.08)"/>
  <circle cx="210" cy="30" r="40" fill="rgba(245,131,42,0.07)"/>
  <!-- Big sakura bloom -->
  <g opacity="0.75" transform="translate(180,55)">
    <ellipse rx="11" ry="22" fill="#F2637A" transform="rotate(0)"/>
    <ellipse rx="11" ry="22" fill="#F5832A" transform="rotate(72)"/>
    <ellipse rx="11" ry="22" fill="#F2637A" transform="rotate(144)"/>
    <ellipse rx="11" ry="22" fill="#F5832A" transform="rotate(216)"/>
    <ellipse rx="11" ry="22" fill="#F2637A" transform="rotate(288)"/>
    <circle r="6" fill="#fff" opacity="0.9"/>
  </g>
  <!-- Small sakura bloom -->
  <g opacity="0.5" transform="translate(210,20)">
    <ellipse rx="6" ry="12" fill="#FFB6C1" transform="rotate(0)"/>
    <ellipse rx="6" ry="12" fill="#FFB6C1" transform="rotate(72)"/>
    <ellipse rx="6" ry="12" fill="#FFB6C1" transform="rotate(144)"/>
    <ellipse rx="6" ry="12" fill="#FFB6C1" transform="rotate(216)"/>
    <ellipse rx="6" ry="12" fill="#FFB6C1" transform="rotate(288)"/>
    <circle r="3" fill="#fff" opacity="0.9"/>
  </g>
  <!-- Petal scatter -->
  <ellipse cx="140" cy="100" rx="5" ry="9" fill="#F2637A" opacity="0.3" transform="rotate(30 140 100)"/>
  <ellipse cx="220" cy="80" rx="4" ry="7" fill="#F5832A" opacity="0.25" transform="rotate(-20 220 80)"/>
  <ellipse cx="160" cy="130" rx="3" ry="6" fill="#F2637A" opacity="0.2" transform="rotate(15 160 130)"/>
</svg>

<div class="page-wrapper">

  <header>
    <div class="header-left">
      <div class="jp-label">桜の旅 · Japan Trip</div>
      <h1>Japan Trip<br><em>2027</em></h1>
      <div class="header-meta">
        <span>🗓 July 2027</span>
        <span>👨‍👩‍👧‍👦 4 Families · <span id="totalMembers">16</span> Travelers</span>
        <span>🎯 ₱100,000 / person</span>
      </div>
    </div>
    <div class="countdown-chip" id="countdownChip">⏳ Loading...</div>
  </header>

  <!-- GRAND TOTAL -->
  <div class="grand-total" id="grandTotal">
    <div class="stat-block">
      <div class="stat-label">Total Saved</div>
      <div class="stat-value highlight" id="grandSaved">₱0</div>
    </div>
    <div class="stat-block">
      <div class="stat-label">Grand Target</div>
      <div class="stat-value" id="grandTarget">₱0</div>
    </div>
    <div class="stat-block">
      <div class="stat-label">Still Needed</div>
      <div class="stat-value" id="grandRemaining">₱0</div>
    </div>
    <div class="stat-block">
      <div class="stat-label">Overall Progress</div>
      <div class="stat-value green" id="grandPct">0%</div>
    </div>
    <div class="grand-progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="grandBar" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- FAMILIES GRID -->
  <div class="families-grid" id="familiesGrid"></div>

  <div class="last-updated">Last updated: <span id="lastUpdated">—</span></div>

</div>

<script>
let DATA = null;

// ─── Countdown ───────────────────────────────────────────────────────────
function updateCountdown() {
  const target = new Date('2027-07-01T00:00:00');
  const now = new Date();
  const diff = target - now;
  if (diff <= 0) { document.getElementById('countdownChip').textContent = '🌸 Trip time!'; return; }
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const months = Math.floor(days / 30);
  const remDays = days % 30;
  document.getElementById('countdownChip').textContent =
    `⏳ ${months}m ${remDays}d to go`;
}
updateCountdown();
setInterval(updateCountdown, 60000);

// ─── Formatting ──────────────────────────────────────────────────────────
function fmt(n) {
  return DATA.trip.currency + n.toLocaleString('en-PH');
}
function pct(saved, target) {
  return Math.min(100, Math.round((saved / target) * 100));
}
function statusIcon(p) {
  if (p >= 100) return { icon: '✓', cls: 'done' };
  if (p >= 70)  return { icon: '◐', cls: 'near' };
  return { icon: '○', cls: 'early' };
}
function memberColor(p, familyColor) {
  if (p >= 100) return '#5B9E6A';
  if (p >= 70)  return '#E8A820';
  return familyColor;
}

// ─── Render ──────────────────────────────────────────────────────────────
function render() {
  const target = DATA.trip.targetPerPerson;
  let totalSaved = 0, totalTarget = 0, totalMembers = 0;

  DATA.families.forEach(f => {
    f.members.forEach(m => {
      totalSaved += m.saved;
      totalTarget += target;
      totalMembers++;
    });
  });

  const overallPct = pct(totalSaved, totalTarget);
  document.getElementById('grandSaved').textContent = fmt(totalSaved);
  document.getElementById('grandTarget').textContent = fmt(totalTarget);
  document.getElementById('grandRemaining').textContent = fmt(Math.max(0, totalTarget - totalSaved));
  document.getElementById('grandPct').textContent = overallPct + '%';
  document.getElementById('totalMembers').textContent = totalMembers;
  setTimeout(() => {
    document.getElementById('grandBar').style.width = overallPct + '%';
  }, 100);

  // Families grid
  const grid = document.getElementById('familiesGrid');
  grid.innerHTML = '';
  DATA.families.forEach(family => {
    let famSaved = 0;
    family.members.forEach(m => famSaved += m.saved);
    const famTarget = target * family.members.length;
    const famPct = pct(famSaved, famTarget);

    const card = document.createElement('div');
    card.className = 'family-card';
    card.innerHTML = `
      <div class="family-header">
        <div class="family-title">
          <div class="family-name">${family.name}</div>
          <div class="family-subtitle">${family.members.length} members · ${fmt(famSaved)} saved</div>
        </div>
        <div class="family-pct" style="color:${family.color}">${famPct}%</div>
        <div class="family-color-pill" style="background:${family.color}">${famPct >= 100 ? '🎉' : famPct >= 70 ? '◐' : '○'}</div>
      </div>
      <div class="members-list">
        ${family.members.map(m => {
          const p = pct(m.saved, target);
          const remaining = Math.max(0, target - m.saved);
          const st = statusIcon(p);
          const col = memberColor(p, family.color);
          return `
          <div class="member-row">
            <div class="member-status ${st.cls}">${st.icon}</div>
            <div class="member-info">
              <div class="member-name">${m.name}</div>
              <div class="member-bar-wrap">
                <div class="member-mini-bar">
                  <div class="member-mini-fill mbf" data-pct="${p}" style="background:${col};width:0%"></div>
                </div>
                <span class="member-pct-small">${p}%</span>
              </div>
            </div>
            <div class="member-amounts">
              <div class="member-saved" style="color:${col}">${fmt(m.saved)}</div>
              <div class="member-remaining">${remaining > 0 ? fmt(remaining) + ' to go' : '🎉 Reached!'}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    `;
    grid.appendChild(card);
  });

  // Animate bars
  setTimeout(() => {
    document.querySelectorAll('.mbf').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
  }, 150);

  // Last updated
  const now = new Date();
  document.getElementById('lastUpdated').textContent =
    now.toLocaleDateString('en-PH', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

// ─── Init — load from savings-data.json ─────────────────────────────────
fetch('savings-data.json')
  .then(res => {
    if (!res.ok) throw new Error('Could not load savings-data.json');
    return res.json();
  })
  .then(json => {
    DATA = json;
    render();
  })
  .catch(err => {
    document.getElementById('familiesGrid').innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#B89080;">
        <div style="font-size:40px;margin-bottom:16px;">⚠️</div>
        <div style="font-family:'Shippori Mincho',serif;font-size:20px;color:#2A1A0F;margin-bottom:8px;">Could not load savings-data.json</div>
        <div style="font-size:14px;line-height:1.6;">Make sure <strong>savings-data.json</strong> is in the same folder as this HTML file,<br>and open it via a local server or browser that allows local file access.</div>
      </div>`;
    console.error(err);
  });
</script>
</body>
</html>
