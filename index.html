<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japan Trip 2027 — Savings Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23DA5327'/%3E%3Crect x='7' y='10' width='18' height='2.6' rx='1' fill='%23fff'/%3E%3Crect x='9' y='14' width='14' height='2' rx='1' fill='%23fff'/%3E%3Crect x='11' y='16' width='2.4' height='9' fill='%23fff'/%3E%3Crect x='18.6' y='16' width='2.4' height='9' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #FAF6F0;
    --card:         #FFFFFF;
    --border:       #E6DED4;
    --border-hover: rgba(218,83,39,0.4);
    --text:         #231A16;
    --text-muted:   #6E655C;
    --text-dim:     #9A928A;

    /* wafū palette — matches the trip deck */
    --coral:       #DA5327;   /* 朱 vermilion — Osaka */
    --coral-light: #FBEAE1;
    --sky:         #2E77A6;   /* 藍 indigo — Tokyo */
    --sky-light:   #E9EEF3;
    --lime:        #6E9142;   /* 抹茶 matcha — day trips */
    --lime-light:  #EBF0E6;
    --gold:        #B28E2B;   /* 金茶 kincha — Kyoto */
    --gold-light:  #EFEAF0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── BACKGROUND SCENE ── */
  .bg-scene {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .page-wrapper {
    position: relative;
    z-index: 1;
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 24px 100px;
  }

  /* ── HERO ── */
  .hero {
    padding: 52px 0 44px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }
  .hero-text { flex: 1; }
  .hero-eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--coral);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hero-eyebrow::before {
    content: '';
    width: 20px; height: 2.5px;
    background: var(--coral);
    border-radius: 2px;
    display: inline-block;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(40px, 5.5vw, 64px);
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  h1 .accent { color: var(--coral); display: block; }
  .hero-meta {
    margin-top: 18px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .meta-pill {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 100px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .countdown-badge {
    background: var(--coral);
    border-radius: 20px;
    padding: 14px 22px;
    color: #fff;
    text-align: center;
    box-shadow: 0 6px 24px rgba(218,83,39,0.35);
    flex-shrink: 0;
    min-width: 130px;
  }
  .countdown-badge .cd-num {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 900;
    line-height: 1;
    display: block;
  }
  .countdown-badge .cd-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.85;
    margin-top: 4px;
  }

  /* ── STAT CARDS ── */
  .stat-cards {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 36px;
  }
  .stat-card {
    border-radius: 20px;
    padding: 24px 28px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
  }
  .stat-card svg, .countdown-badge svg { width:100%; height:100%; display:block; fill:currentColor; }
  .stat-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 90% 10%, rgba(255,255,255,0.18) 0%, transparent 55%);
    pointer-events: none;
  }
  .stat-card.card-saved    { background: var(--coral); }
  .stat-card.card-needed   { background: var(--sky); }
  .stat-card.card-target   { background: #fff; border: 1.5px solid var(--border); box-shadow: 0 2px 12px rgba(110,101,92,0.08); }

  .stat-card-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .stat-card.card-saved .stat-card-label,
  .stat-card.card-needed .stat-card-label { color: rgba(255,255,255,0.7); }
  .stat-card.card-target .stat-card-label { color: var(--text-dim); }

  .stat-card-value {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 900;
    line-height: 1;
  }
  .stat-card.card-saved .stat-card-value,
  .stat-card.card-needed .stat-card-value { color: #fff; }
  .stat-card.card-target .stat-card-value { color: var(--text); }

  .stat-card-sub {
    font-size: 12px;
    font-weight: 500;
    margin-top: 8px;
  }
  .stat-card.card-saved .stat-card-sub,
  .stat-card.card-needed .stat-card-sub { color: rgba(255,255,255,0.65); }
  .stat-card.card-target .stat-card-sub { color: var(--text-dim); }

  /* Progress bar inside saved card */
  .stat-card-bar-bg {
    margin-top: 16px;
    background: rgba(255,255,255,0.25);
    border-radius: 100px;
    height: 8px;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }
  .stat-card-bar-fill {
    height: 100%;
    border-radius: 100px;
    background: linear-gradient(90deg, #F2D4C4, #fff);
    transition: width 1.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 8px rgba(255,255,255,0.5);
  }

  /* ── SECTION LABEL ── */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── FAMILY CARDS ── */
  .families-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    align-items: start;
  }

  .family-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    transition: transform 0.3s, box-shadow 0.3s;
    box-shadow: 0 2px 16px rgba(110,101,92,0.08);
  }
  .family-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(110,101,92,0.15);
  }

  .family-header {
    padding: 20px 24px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    overflow: hidden;
    border-bottom: 1.5px solid var(--border);
  }
  .family-header-bg {
    position: absolute;
    inset: 0;
    opacity: 0.07;
  }
  .family-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  .family-icon svg { width: 26px; height: 26px; }
  .family-title-block { flex: 1; position: relative; z-index: 1; }
  .family-name {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.2;
  }
  .family-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
    font-weight: 500;
  }
  .family-pct-badge {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 900;
    line-height: 1;
    position: relative;
    z-index: 1;
  }

  /* ── MEMBER ROWS ── */
  .members-list { padding: 8px 20px 16px; }

  .member-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 10px 8px;
    border-radius: 16px;
    border-bottom: 1px solid rgba(154,146,138,0.18);
    transition: background 0.2s;
  }
  .member-row:last-child { border-bottom: none; }
  .member-row:hover { background: #FAF6F0; }

  /* Name — large and prominent */
  .member-info { min-width: 0; }
  .member-name {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  /* ── KEYFRAMES ── */
  @keyframes float {
    0%, 100% { transform: translate(-50%, -50%) translateY(0px) rotate(0deg); }
    25%       { transform: translate(-50%, -50%) translateY(-5px) rotate(1.5deg); }
    75%       { transform: translate(-50%, -50%) translateY(3px) rotate(-1deg); }
  }
  @keyframes float-alt {
    0%, 100% { transform: translate(-50%, -50%) translateY(0px) rotate(0deg); }
    30%       { transform: translate(-50%, -50%) translateY(4px) rotate(-2deg); }
    70%       { transform: translate(-50%, -50%) translateY(-4px) rotate(1deg); }
  }
  @keyframes pulse-ring {
    0%   { box-shadow: 0 3px 12px rgba(0,0,0,0.22), 0 0 0 0 rgba(255,255,255,0.6); }
    60%  { box-shadow: 0 3px 12px rgba(0,0,0,0.22), 0 0 0 7px rgba(255,255,255,0); }
    100% { box-shadow: 0 3px 12px rgba(0,0,0,0.22), 0 0 0 0 rgba(255,255,255,0); }
  }
  @keyframes shimmer {
    0%   { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes bar-glow {
    0%, 100% { box-shadow: 0 0 0px rgba(255,255,255,0); }
    50%       { box-shadow: 0 0 10px rgba(255,255,255,0.55); }
  }
  @keyframes count-bounce {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.04); }
  }

  /* Progress bar with photo marker */
  .member-bar-wrap {
    position: relative;
    padding: 26px 0;
    margin: -6px 0;
  }
  .member-bar-track {
    height: 12px;
    background: rgba(154,146,138,0.16);
    border-radius: 100px;
    overflow: visible;
    position: relative;
  }
  .member-bar-inner {
    height: 100%;
    border-radius: 100px;
    overflow: hidden;
    position: relative;
  }
  .member-bar-fill {
    height: 100%;
    border-radius: 100px;
    transition: width 1.1s cubic-bezier(0.16, 1, 0.3, 1);
    animation: bar-glow 3s ease-in-out infinite;
  }

  /* Milestone ticks on the track */
  .ms-tick {
    position: absolute;
    top: -4px;
    width: 2px;
    height: 20px;
    background: #9A928A;
    opacity: 0.55;
    border-radius: 1px;
    transform: translateX(-50%);
  }
  .ms-tick::after {
    content: attr(data-ms);
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #9A928A;
  }
  .ms-chips { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: 1px; }
  .ms-chip {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.3px;
    padding: 1px 6px;
    border-radius: 999px;
    border: 1px solid #D9D2C7;
    color: #9A928A;
    background: #fff;
  }
  .ms-chip.hit { background: #B28E2B; border-color: #B28E2B; color: #fff; }
  .ms-chip.won { background: #8C2318; border-color: #8C2318; color: #fff; box-shadow: 0 0 0 2px #FBEAE1; }
  .ms-prize { font-size: 10.5px; font-weight: 700; color: #8C2318; margin-left: 4px; }

  .ms-legend {
    display: flex;
    align-items: baseline;
    gap: 18px;
    flex-wrap: wrap;
    margin: -8px 0 18px;
    font-size: 12.5px;
    color: #6E655C;
  }
  .ms-legend b { color: #231A16; }
  .ms-legend .ms-key {
    font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 999px;
    background: #B28E2B; color: #fff; margin-right: 5px; vertical-align: 1px;
  }

  /* Photo marker — floats gently at bar tip */
  .bar-photo-marker {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 3px 12px rgba(0,0,0,0.22);
    overflow: hidden;
    background: #eee;
    pointer-events: none;
    transition: left 1.1s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    z-index: 2;
    animation: float 4s ease-in-out infinite, pulse-ring 3.5s ease-out infinite;
  }
  /* Stagger float direction per every other marker */
  .bar-photo-marker.alt {
    animation: float-alt 4.5s ease-in-out infinite, pulse-ring 4s ease-out infinite;
  }
  .bar-photo-marker img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }

  /* Stat cards animate in on load */
  .stat-card {
    animation: fade-up 0.6s ease both;
  }
  .stat-card:nth-child(1) { animation-delay: 0.05s; }
  .stat-card:nth-child(2) { animation-delay: 0.15s; }
  .stat-card:nth-child(3) { animation-delay: 0.25s; }

  /* Stat card bar fill shimmer */
  .stat-card-bar-fill {
    background: linear-gradient(90deg, #F2D4C4 0%, #fff 40%, #F2D4C4 60%, #fff 100%);
    background-size: 200% auto;
    animation: shimmer 3s linear infinite;
  }

  /* Family cards fade-up on load */
  .family-card {
    animation: fade-up 0.7s ease both;
  }
  .family-card:nth-child(1) { animation-delay: 0.1s; }
  .family-card:nth-child(2) { animation-delay: 0.2s; }
  .family-card:nth-child(3) { animation-delay: 0.3s; }
  .family-card:nth-child(4) { animation-delay: 0.4s; }

  /* Countdown badge pulses */
  .countdown-badge {
    animation: count-bounce 4s ease-in-out infinite;
  }

  .member-right { text-align: right; flex-shrink: 0; }
  .member-saved {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 800;
    line-height: 1.2;
  }
  .member-remaining {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    font-weight: 500;
  }

  /* ── FOOTER ── */
  .footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1.5px solid var(--border);
    font-weight: 500;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    .families-grid { grid-template-columns: 1fr; }
    .stat-cards { grid-template-columns: 1fr; }
    .hero { flex-direction: column; align-items: flex-start; }
    h1 { font-size: 36px; }
    .member-name { font-size: 15px; }
  }
</style>
</head>
<body>

<!-- ── BACKGROUND SCENE ── -->
<div class="bg-scene">
  <svg width="100%" height="100%" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="skyGrad" cx="70%" cy="0%" r="60%">
        <stop offset="0%" stop-color="#D4E0EC" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#FAF6F0" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#E3CD8F" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#E3CD8F" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="peachGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#E8C4AE" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#E8C4AE" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <ellipse cx="1100" cy="-60" rx="700" ry="500" fill="url(#skyGrad)"/>

    <ellipse cx="200" cy="950" rx="500" ry="300" fill="url(#peachGrad)"/>
    <!-- Fuji -->
    <g opacity="0.07">
      <polygon points="1200,600 1320,200 1440,600" fill="#2E77A6"/>
      <polygon points="1240,600 1320,260 1400,600" fill="#fff"/>
    </g>

      <rect x="30" y="295" width="174" height="18" rx="5"/>
      <rect x="48" y="330" width="138" height="12" rx="4"/>
    </g>
    <!-- Sakura petals -->
    <g opacity="0.18">
      <g transform="translate(980,120) rotate(15)">
        <ellipse rx="9" ry="18" fill="#C97A8E" transform="rotate(0)"/>
        <ellipse rx="9" ry="18" fill="#C97A8E" transform="rotate(72)"/>
        <ellipse rx="9" ry="18" fill="#C97A8E" transform="rotate(144)"/>
        <ellipse rx="9" ry="18" fill="#C97A8E" transform="rotate(216)"/>
        <ellipse rx="9" ry="18" fill="#C97A8E" transform="rotate(288)"/>
        <circle r="5" fill="#F2E4E8"/>
      </g>
      <g transform="translate(1080,60) rotate(-20)" opacity="0.7">
        <ellipse rx="6" ry="12" fill="#C97A8E" transform="rotate(0)"/>
        <ellipse rx="6" ry="12" fill="#C97A8E" transform="rotate(72)"/>
        <ellipse rx="6" ry="12" fill="#C97A8E" transform="rotate(144)"/>
        <ellipse rx="6" ry="12" fill="#C97A8E" transform="rotate(216)"/>
        <ellipse rx="6" ry="12" fill="#C97A8E" transform="rotate(288)"/>
        <circle r="3" fill="#F2E4E8"/>
      </g>
      <g transform="translate(1180,150) rotate(35)" opacity="0.55">
        <ellipse rx="7" ry="14" fill="#A8657E" transform="rotate(0)"/>
        <ellipse rx="7" ry="14" fill="#A8657E" transform="rotate(72)"/>
        <ellipse rx="7" ry="14" fill="#A8657E" transform="rotate(144)"/>
        <ellipse rx="7" ry="14" fill="#A8657E" transform="rotate(216)"/>
        <ellipse rx="7" ry="14" fill="#A8657E" transform="rotate(288)"/>
        <circle r="4" fill="#F2E4E8"/>
      </g>
      <ellipse cx="900" cy="80" rx="5" ry="10" fill="#C97A8E" opacity="0.5" transform="rotate(20 900 80)"/>
      <ellipse cx="1140" cy="200" rx="4" ry="8" fill="#C97A8E" opacity="0.4" transform="rotate(-10 1140 200)"/>
      <ellipse cx="1050" cy="170" rx="3" ry="7" fill="#A8657E" opacity="0.35" transform="rotate(45 1050 170)"/>
      <ellipse cx="1260" cy="100" rx="4" ry="9" fill="#C97A8E" opacity="0.3" transform="rotate(-30 1260 100)"/>
    </g>
    <!-- Sunflower -->
    <g transform="translate(1390,30)" opacity="0.13">
      <ellipse rx="8" ry="22" fill="#B28E2B" transform="rotate(0)"/>
      <ellipse rx="8" ry="22" fill="#B28E2B" transform="rotate(30)"/>
      <ellipse rx="8" ry="22" fill="#B28E2B" transform="rotate(60)"/>
      <ellipse rx="8" ry="22" fill="#B28E2B" transform="rotate(90)"/>
      <ellipse rx="8" ry="22" fill="#B28E2B" transform="rotate(120)"/>
      <ellipse rx="8" ry="22" fill="#B28E2B" transform="rotate(150)"/>
      <circle r="12" fill="#6B4E14"/>
    </g>
    <!-- Waves -->
    <g opacity="0.06">
      <path d="M0,820 Q180,780 360,820 Q540,860 720,820 Q900,780 1080,820 Q1260,860 1440,820 L1440,900 L0,900 Z" fill="#2E77A6"/>
      <path d="M0,850 Q180,820 360,850 Q540,880 720,850 Q900,820 1080,850 Q1260,880 1440,850 L1440,900 L0,900 Z" fill="#2E77A6" opacity="0.6"/>
    </g>
    <!-- Bamboo -->
    <g opacity="0.07" fill="#6E9142">
      <rect x="0" y="400" width="8" height="500" rx="4"/>

// ── Countdown — next milestone deadline, then the trip ───────────────
function updateCountdown() {
  const now = new Date();
  const targets = MILESTONES
    .map(ms => ({ label: "to " + ms.label + " · " + ms.due, date: new Date(ms.date + "T23:59:59") }))
    .concat([{ label: "to the trip!", date: new Date('2027-05-29T00:00:00') }])
    .sort((a, b) => a.date - b.date);
  const next = targets.find(t => t.date > now) || targets[targets.length - 1];
  const diff = next.date - now;
  document.getElementById('cdDays').textContent =
    diff <= 0 ? '0' : Math.floor(diff / 86400000).toLocaleString();
  document.querySelector('.countdown-badge .cd-label').textContent = "days " + next.label;
}

    return `<div class="bar-photo-marker${altClass}" style="background:${av.bg}; color:${av.text}">
      <span style="position:absolute;font-size:9px;font-weight:800">${ini}</span>
      <img src="${m.photo}" alt="" onerror="this.style.display='none'" style="position:relative;z-index:1">
    </div>`;
  }
  return `<div class="bar-photo-marker${altClass}" style="background:${av.bg}; color:${av.text}; font-size:9px">${ini}</div>`;
}

// ── Render ────────────────────────────────────────────────────────────
function render() {
  const defaultTarget = TARGET_OVERRIDE ?? DATA.trip.targetPerPerson;
  let totalSaved = 0, totalTarget = 0, totalMembers = 0;

  DATA.families.forEach(f => {
    const cfg = famConfig(f.name);
    f.members.forEach(m => {
      totalSaved  += m.saved * cfg.rate;
      totalTarget += cfg.target;
      totalMembers++;
    });
  });

  const op = pct(totalSaved, totalTarget);
  document.getElementById('pillTarget').textContent = fmt(defaultTarget);
  document.getElementById('subTarget').textContent  = fmt(defaultTarget);
  document.getElementById('grandSaved').textContent     = fmt(totalSaved);
  document.getElementById('grandTarget').textContent    = fmt(totalTarget);
  document.getElementById('grandRemaining').textContent = fmt(Math.max(0, totalTarget - totalSaved));
  document.getElementById('grandPctSub').textContent    = op + '% of group target';
  document.getElementById('totalMembers').textContent   = totalMembers;
  const tm2 = document.getElementById('totalMembers2');
  if (tm2) tm2.textContent = totalMembers;
  setTimeout(() => { document.getElementById('grandBar').style.width = op + '%'; }, 120);

  const grid = document.getElementById('familiesGrid');
  grid.innerHTML = '';

  document.getElementById('msLegend').innerHTML = MILESTONES.map(ms =>
    `<span><span class="ms-key">${ms.label}</span><b>${fmt(ms.amt)}</b> by ${ms.due}` +
    (ms.prize ? ` <span class="ms-prize">🏆 ${fmt(ms.prize)} ${ms.winner ? 'won by ' + ms.winner : 'reward — first to reach ' + fmt(ms.amt)}</span>` : '') +
    `</span>`
  ).join('') +
  FAMILY_OVERRIDES.map(o => {
    const fam = DATA.families.find(f => f.name.trim().toLowerCase().startsWith(o.match.toLowerCase()));
    if (!fam) return '';
    const c = famConfig(fam.name);
    return `<span style="color:#9A928A">— ${fam.name}: ${o.milestones.map(m => fmtFam(m.amt, c)).join(' / ')} (${fmtFam(o.target, c)} goal)</span>`;
  }).join('') +
  `<span style="color:#9A928A">— others per traveler, of the ${fmt(defaultTarget)} goal</span>`;

  // palette index per family (default: JSON order), with K↔R swap
  const palIdx = DATA.families.map((_, i) => i % CITY_PALS.length);
  const kI = DATA.families.findIndex(f => /^k/i.test(f.name.trim()));
  const rI = DATA.families.findIndex(f => /^r/i.test(f.name.trim()));
  if (kI > -1 && rI > -1) { const t = palIdx[kI]; palIdx[kI] = palIdx[rI]; palIdx[rI] = t; }

  DATA.families.forEach((family, fi) => {
    const cfg    = famConfig(family.name);
    const target = cfg.target;
    const msList = cfg.milestones;
    let famSaved = 0;
    family.members.forEach(m => famSaved += m.saved * cfg.rate);
    const famPct = pct(famSaved, target * family.members.length);
    const pi     = palIdx[fi];
    const col    = CITY_PALS[pi].accent;
    const icon   = FAMILY_ICONS[pi % FAMILY_ICONS.length];

    const card = document.createElement('div');
    card.className = 'family-card';
    card.innerHTML = `
      <div class="family-header">
        <div class="family-header-bg" style="background:${col}"></div>
        <div class="family-icon" style="background:${CITY_PALS[pi].tint}; color:${col}">${icon}</div>
        <div class="family-title-block">
          <div class="family-name">${family.name}</div>
          <div class="family-sub">${family.members.length} members &nbsp;·&nbsp; ${fmtFam(famSaved, cfg)} saved</div>
        </div>
        <div class="family-pct-badge" style="color:${col}">${famPct}%</div>
      </div>
      <div class="members-list">
        ${family.members.map((m, mi) => {
          const savedP = m.saved * cfg.rate;
          const p    = pct(savedP, target);
          const rem  = Math.max(0, target - savedP);
          const col2 = barColor(p, col);
          const av   = AVATAR_PALETTES[(fi * 4 + mi) % AVATAR_PALETTES.length];
          const reached = p >= 100;
          const ticks = msList.map(ms =>
            `<div class="ms-tick" data-ms="${ms.label}" style="left:${Math.min(100, ms.amt / target * 100)}%"></div>`).join('');
          const chips = `<span class="ms-chips">${msList.map(ms => {
            const won = ms.winner && ms.winner === m.name;
            return `<span class="ms-chip${savedP >= ms.amt ? ' hit' : ''}${won ? ' won' : ''}">${won ? '🏆 ' : ''}${ms.label}${savedP >= ms.amt ? ' ✓' : ''}</span>`;
          }).join('')}</span>`;

          return `
          <div class="member-row">
            <div class="member-info">
              <div class="member-name">${m.name}</div>
              <div class="member-bar-wrap">
                <div class="member-bar-track">
                  ${ticks}
                  <div class="member-bar-inner">
                    <div class="member-bar-fill mbf" data-pct="${p}"
                         style="background:${col2}; width:0%"></div>
                  </div>
                  ${markerHTML(m, av, fi * 10 + mi)}
                </div>
              </div>
            </div>
            <div class="member-right">
              <div class="member-saved" style="color:${col2}">${fmtFam(savedP, cfg)}${chips}</div>
              <div class="member-remaining">${reached ? STAR + '<span style="color:#B28E2B;font-weight:700">Goal reached!</span>' : fmtFam(rem, cfg) + ' to go'}</div>
            </div>
          </div>`;
        }).join('')}
      </div>`;
    grid.appendChild(card);
  });

  // Animate bars + photo marker positions
  setTimeout(() => {
    document.querySelectorAll('.member-bar-wrap').forEach(wrap => {
      const fill   = wrap.querySelector('.mbf');
      const marker = wrap.querySelector('.bar-photo-marker');
      const p      = parseFloat(fill.dataset.pct);
      fill.style.width = p + '%';
      if (marker) {
        // clamp so marker stays visible at both ends
        const clampedPct = Math.max(2, Math.min(98, p));
        marker.style.left = clampedPct + '%';
      }
    });
  }, 160);

  const now = new Date();
  document.getElementById('lastUpdated').textContent =
    now.toLocaleDateString('en-PH', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

// ── Load ─────────────────────────────────────────────────────────────
fetch('savings-data.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(json => { DATA = json; render(); })
  .catch(() => {
    document.getElementById('familiesGrid').innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:60px 20px;">
        <div style="font-size:40px;margin-bottom:16px">⚠️</div>
        <div style="font-family:'Playfair Display',serif;font-size:20px;color:#231A16;margin-bottom:8px">Could not load savings-data.json</div>
        <div style="font-size:14px;color:#6E655C;line-height:1.7">Make sure <strong>savings-data.json</strong> is in the same folder as this HTML file<br>and open via a local server (e.g. <code>python3 -m http.server</code>).</div>
      </div>`;
  });
</script>
</body>
</html>
